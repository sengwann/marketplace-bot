services:
  - type: web
    name: skk-bot
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run render-build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_SSL
        value: "true"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: CHANNEL_NAME
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_DOMAIN
        sync: false
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
      - key: MAX_LISTINGS_PER_USER_PER_DAY
        value: "5"